name: iOS Build & TestFlight

on:
  push:
    branches: [master, main]
    paths:
      - "mobile/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  # Kotlin/Native link of Compose + material-icons-extended OOMs at the default 2g.
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -Dkotlin.daemon.jvmargs=-Xmx6g"

jobs:
  # Always validate the KMP iOS framework compiles on check-in.
  build-framework:
    name: Compile ComposeApp (iOS)
    runs-on: macos-14
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Link release framework (iosArm64)
        run: ./gradlew :composeApp:linkReleaseFrameworkIosArm64 --stacktrace

  # Archive + upload to TestFlight when Apple signing secrets are configured.
  deploy-testflight:
    name: Archive & upload TestFlight
    needs: build-framework
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Apple Team ID
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::Missing secret APPLE_TEAM_ID (Apple Developer Team ID). Add it under repo Settings → Secrets."
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: mobile

      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          mkdir -p "$HOME/private_keys"
          KEY_PATH="$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          printf '%s\n' "$APP_STORE_CONNECT_API_KEY_P8" > "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Inject Team ID into xcconfig
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          sed -i '' "s/^TEAM_ID=.*/TEAM_ID=${APPLE_TEAM_ID}/" iosApp/Configuration/Config.xcconfig
          sed -i '' "s/TEAM_ID_PLACEHOLDER/${APPLE_TEAM_ID}/" iosApp/ExportOptions.plist
          cat iosApp/Configuration/Config.xcconfig

      - name: Bump CFBundleVersion from run number
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" iosApp/iosApp/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" iosApp/iosApp/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" iosApp/iosApp/Info.plist

      - name: Cache distribution signing keychain
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Keychains/lukaria-ci.keychain-db
            ~/Library/Keychains/lukaria-ci.keychain-db-shm
            ~/Library/Keychains/lukaria-ci.keychain-db-wal
            ~/Library/MobileDevice/Provisioning Profiles
          key: ios-dist-keychain-${{ secrets.APPLE_TEAM_ID }}-v2
          restore-keys: |
            ios-dist-keychain-${{ secrets.APPLE_TEAM_ID }}-

      - name: Build IPA + upload TestFlight (Fastlane)
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CI_KEYCHAIN_PASSWORD: lukaria-ci-temp
          FASTLANE_SKIP_UPDATE_CHECK: "1"
        run: bundle exec fastlane ios beta

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: svelte-ios-ipa
          path: |
            ${{ runner.temp }}/Svelte.ipa
            ${{ runner.temp }}/Svelte.xcarchive
          if-no-files-found: ignore
          retention-days: 14
