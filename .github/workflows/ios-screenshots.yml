name: iOS App Store Screenshots

on:
  workflow_dispatch:

env:
  JAVA_VERSION: "17"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -Dkotlin.daemon.jvmargs=-Xmx6g"

jobs:
  screenshots:
    name: Capture iPhone + iPad screenshots
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make scripts executable
        run: chmod +x ./gradlew scripts/capture-app-store-screenshots.sh

      - name: Build app for simulator
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
          echo "APP_PATH=$(find "$PWD/build/sim/Build/Products" -maxdepth 2 -name '*.app' | head -1)" >> "$GITHUB_ENV"

      - name: Capture screenshots
        env:
          LUKARIA_SCREENSHOT_TOKEN: ${{ secrets.LUKARIA_SCREENSHOT_TOKEN }}
        run: scripts/capture-app-store-screenshots.sh "$APP_PATH" "$RUNNER_TEMP/screenshots"

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots
          path: ${{ runner.temp }}/screenshots
          retention-days: 14
